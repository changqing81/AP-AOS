# AlasAos rootfs 内置 deploy 配置：行结构按 ALAS config/deploy.template-linux-cn.yaml，
# 更新器七键全锁定 + fullcn 同款镜像（git.lyoko.io / aliyun pypi）。
# Repository 绝不能写 gitee URL 或 tuna pypi 镜像：ALAS config_redirect() 会按内置
# 规则把非约定值静默改写（gitee→lyoko），写了也留不住，徒增排查成本。
# AutoUpdate:false 是保住 rootfs 钉版 commit（BUILD_MANIFEST.alas_commit）的唯一闸门。
Deploy:
  Git:
    # fullcn 同款镜像；不要改成 gitee（会被 config_redirect 改写）
    Repository: git://git.lyoko.io/AzurLaneAutoScript
    Branch: master
    GitExecutable: /usr/bin/git
    GitProxy: null
    SSLVerify: true
    # 锁定①：禁止启动时 git pull，保住钉版 commit
    # ⚠️ M3 待办：**该键在 azurpilot 上游已不存在**（被 CloudUpdateControl / GitOverCdn
    # 取代），此处的取值对 azurpilot 是空操作 → 「钉版保护」在 azurpilot 下当前**无闸门**，
    # 必须按上游新键重建。另：上面 Repository 的值对 azurpilot 也不适用，且
    # config_redirect() 会静默改写旧 gitee/lyoko 类 URL。详见
    # docs/upstream-swap-azurpilot.md §9 与 §12。
    AutoUpdate: false

  Python:
    # M1 起依赖装在 **uv 托管的 venv** 里（发行版 python3 是 3.14.4，低于上游
    # requires-python >=3.14.6）。此路径必须与 build-rootfs.sh 的 GUEST_PYTHON
    # 及 App 侧 ProotHost.GUEST_PYTHON 同源，改一处要三处同改。
    PythonExecutable: /opt/alas/.venv/bin/python
    PypiMirror: https://mirrors.aliyun.com/pypi/simple
    # 锁定②：依赖在构建期已装好，禁止启动时 pip install
    InstallDependencies: false
    # 注：azurpilot 已废弃 deploy/headless/requirements.txt（改用 pyproject + uv），
    # 该键在 azurpilot 下不会被读取（InstallDependencies:false 已锁）
    RequirementsFile: ./deploy/headless/requirements.txt

  Adb:
    AdbExecutable: /usr/bin/adb
    # 锁定③④：不替换/不暴连 adb；真机连接由 wrapper 负责
    ReplaceAdb: false
    AutoConnect: false
    # 源码里该键为 if False 死键，置 false 表明意图
    InstallUiautomator2: false

  Ocr:
    # in-proc 版 module/ocr/rpc.py（overlays，并行任务提供）保留读取下列键，
    # 但 OCR 已在本进程内推理：UseOcrServer:true 走 ModelProxy 路径，地址不再真连
    UseOcrServer: true
    StartOcrServer: false
    OcrServerPort: 22268
    OcrClientAddress: 127.0.0.1:22300

  Update:
    # 锁定⑤⑥⑦：禁用内置更新器重载、定时检查与定时重启
    EnableReload: false
    CheckUpdateInterval: 0
    AutoRestartTime: null

  Misc:
    DiscordRichPresence: false

  RemoteAccess:
    EnableRemoteAccess: false
    SSHUser: null
    SSHServer: null
    SSHExecutable: /usr/bin/ssh

  Webui:
    WebuiHost: 0.0.0.0
    # 22267 是 ALAS WebUI 默认端口；22367 是 AlasApp 另一套，勿混
    WebuiPort: 22267
    Language: zh-CN
    Theme: default
    DpiScaling: true
    Password: null
    CDN: false
    Run: null
    WebuiSSLKey: null
    WebuiSSLCert: null
