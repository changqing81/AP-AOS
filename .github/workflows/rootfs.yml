name: rootfs

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: '同时构建 debug APK（产物很大，约 850MB；本地无 Android 工具链时用这个）'
        type: boolean
        default: false
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/rootfs.yml'

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          df -h

      - name: Build rootfs
        run: bash rootfs/build/build-rootfs.sh

      # Spike F 门禁是 **ALAS 时代对我方 in-proc OCR shim 的验收测试**：
      # 它用 --rpc-path 指向的 rpc.py 必须暴露我方 shim 的接口（alive()/模型加载）。
      # flavor=azurpilot 下按冻结决策「OCR 走原生」——上游 rpc.py **不被覆盖**，
      # 我方 shim 只放在 seeds/ocr_fallback/ 作兜底，所以这个门禁对 azurpilot 无意义。
      # （首跑 run #35984307419 即因此 FAIL：[FAIL] model_load  alive() is False）
      # 自检测而非加配置：seeds/ocr_fallback/rpc.py 存在 ⇔ 上游 OCR 保持原生。
      # TODO(M0-S2)：为 azurpilot 补一个**原生 OCR 门禁**（可参考 wess09 的
      #   rootfs/build/azurpilot-ocr-gate.py），在那之前 azurpilot 跳过本步骤。
      - name: Spike F OCR gate
        run: |
          if [ -f work/rootfs/opt/alas/seeds/ocr_fallback/rpc.py ]; then
            echo "flavor=azurpilot（检测到 seeds/ocr_fallback/）：OCR 走上游原生实现"
            echo "Spike F 是 ALAS 时代对我方 shim 的验收，对 azurpilot 不适用 → 跳过"
            echo "原生 OCR 门禁待 M0-S2 补齐（见 docs/upstream-swap-azurpilot.md §12）"
            exit 0
          fi
          # 构建脚本打包前已显式卸载全部 bind mount；chroot 跑门禁前重新挂上
          # （onnxruntime 的 CPU 拓扑探测读 /sys，缺 /proc /sys /dev 时行为不确定）
          for d in dev proc sys; do sudo mount --bind /$d work/rootfs/$d; done
          trap 'for d in sys proc dev; do sudo umount -lf work/rootfs/$d || true; done' EXIT
          sudo chroot work/rootfs /opt/alas/.venv/bin/python /opt/alas/spike-f-ocr-gate.py \
            --model-dir /opt/alas/models/ocr \
            --rpc-path /opt/alas/module/ocr/rpc.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
            dist/SIZE_REPORT.txt
            dist/DEP_USAGE.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # debug APK：把刚烘好的 rootfs 打进 assets，跑 gradlew :app:assembleDebug
  #
  # 为什么放 CI：本机（开发机）没有 Android SDK/NDK/CMake 工具链，构不了 APK。
  # 为什么默认不跑：产物很大（rootfs.tar.xz 770MB + APK 体量相当），
  # 每次 push 都产会把 artifact 配额吃光 —— 故 gate 在 workflow_dispatch + build_apk=true。
  #
  # 关键点：
  #   - fetch-depth: 0 —— versionCode 由 gitVersionCode() 数 commit 得出
  #     （GitVersion.kt 注释明说 "the build fails without a git checkout"）；
  #     默认浅克隆 depth=1 会把 versionCode 数成 1。
  #   - CMake 3.22.1 是 app/build.gradle.kts 里写死的版本，必须装。
  #   - NDK 用 AGENTS.md 记载的 28.2（本机工具链同款）；未显式 pin ndkVersion，
  #     由 AGP 取默认，装 28.2 系列即可。
  # ---------------------------------------------------------------------------
  apk:
    name: apk (debug)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHA ubuntu-24.04 runner 约 14GB 可用磁盘，而本 job 的占用估算约 10GB：
      # NDK ~3.5GB + rootfs.tar.xz 770MB（拷进 assets 后是两份）+ Gradle 依赖 ~1GB
      # + APK 输出 ~800MB + 构建中间产物 ~1GB。不清理极易在打包阶段
      # "No space left on device"。这些是 runner 预装但 APK 构建用不到的大户。
      # 刻意保留 /usr/local/lib/android/sdk 下的 platform-tools / platforms /
      # build-tools（AGP 会复用），只删 emulator 与 system-images。
      - name: Free disk space
        run: |
          echo "--- 清理前 ---"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            2>/dev/null || true
          echo "--- 清理后 ---"; df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 必须**显式覆盖** packages：该 action 的默认值就是 'tools platform-tools'，
      # 而 **tools 包在新版 cmdline-tools（16.0 / 12266719）里已被移除**
      # → `sdkmanager tools` 报 "Failed to find package 'tools'" 并 exit 1，
      # 整个 action 随之失败。
      # 注意：**只删掉 packages 是没用的** —— 不写 = 用 action 默认值，照样带 tools
      # （run 35992292649 写了 packages、run 35993347679 没写，两次同样死在这里）。
      # 因此这里显式写成只有一个有效包。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install CMake 3.22.1 (and best-effort NDK)
        run: |
          set -x
          # CMake 版本是 app/app/build.gradle.kts 里写死的（version = "3.22.1"），必须装对
          sdkmanager --install "cmake;3.22.1" || { echo "::error::CMake 3.22.1 安装失败"; exit 1; }
          # NDK：代码里**没有**声明 ndkVersion（全仓 grep 无），AGP 会自行解析默认版本
          # 并在需要时自动下载。此处预装只为省下载时间，版本猜错不影响正确性
          # （AGP 会下它自己需要的那个），故容错不致命。
          sdkmanager --install "ndk;28.2.13676358" \
            || echo "::warning::NDK 预装失败，交给 AGP 自行下载（不影响正确性）"
          echo "--- 已安装组件（定位版本漂移用）---"
          sdkmanager --list_installed | grep -Ei 'cmake|ndk|platform-tools|build-tools|platforms' || true

      - name: Download rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: rootfs-dist

      - name: Stage rootfs into app assets
        run: |
          ls -la rootfs-dist
          test -s rootfs-dist/rootfs.tar.xz || { echo "::error::rootfs.tar.xz 缺失或为空"; exit 1; }
          cp rootfs-dist/rootfs.tar.xz app/app/src/main/assets/rootfs/rootfs.tar.xz
          cp rootfs-dist/BUILD_MANIFEST app/app/src/main/assets/rootfs/BUILD_MANIFEST
          ls -la app/app/src/main/assets/rootfs/
          # 已拷进 assets，原始那份不再需要（省 ~770MB；本 job 不再上传 rootfs）
          rm -rf rootfs-dist
          df -h /

      # 诊断：从 runner 侧实测各 Maven 仓库对 KSP plugin marker 的可达性。
      # run 35996898683 报 `Plugin [id: 'com.google.devtools.ksp', version: '2.3.9'] not found`
      # 而该 artifact 在 Maven Central / Aliyun Central 上确实存在（本机 curl 200）
      # → 需要区分「runner 到某源网络不通」还是「Gradle 仓库路由问题」。日志量极小。
      - name: Probe plugin repositories (diagnostic)
        run: |
          P="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.9/com.google.devtools.ksp.gradle.plugin-2.3.9.pom"
          for base in \
            "https://maven.aliyun.com/repository/google" \
            "https://maven.aliyun.com/repository/central" \
            "https://dl.google.com/dl/android/maven2" \
            "https://repo.maven.apache.org/maven2" \
            "https://plugins.gradle.org/m2" ; do
            code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "$base/$P" 2>/dev/null || echo "CURL_ERR")
            echo "  $code  $base"
          done

      # Kotlin 的块注释**可以嵌套**：注释里出现 `/*` 序列（典型是写路径 `module/**`）
      # 会开启新一层注释而永不闭合 → `Syntax error: Unclosed comment`，
      # 并连锁出一堆 `Unresolved reference`（run 35999029257 即如此：AlasOverlay.kt
      # 未闭合 → KSP 代码生成中断 → `com.aliothmoon.maafw.config` 整包 Unresolved）。
      # 本坑 2026-09-21 已在 LauncherLogScanner/LogCleaner 踩过一次，故在此加静态防线。
      - name: Guard against nested block comments in Kotlin
        run: |
          cd app
          if grep -rnE '^\s*\*.*/\*' --include='*.kt' .; then
            echo "::error::Kotlin 注释里出现 '/*' 序列（会开启嵌套块注释 → Unclosed comment）"
            exit 1
          fi
          echo "OK: Kotlin 注释无嵌套块注释风险"

      - name: Build debug APK
        run: |
          df -h /
          cd app
          # gradlew 的可执行位在 Windows 上提交时会丢失 —— 本仓 git 索引里它是 100644
          # （全仓 100755 文件数为 0），checkout 到 Linux 后 `./gradlew` 直接报
          # "Permission denied"（exit 126，见 run 35994212718）。
          # 此处显式补位；仓库侧同时已把该文件改为 100755 治本。
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Report APK
        run: |
          ls -la app/app/build/outputs/apk/debug/
          df -h /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
