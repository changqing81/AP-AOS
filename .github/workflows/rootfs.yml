name: rootfs

on:
  workflow_dispatch:
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/rootfs.yml'

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          nproc
          df -h

      - name: Build rootfs
        run: bash rootfs/build/build-rootfs.sh

      # Spike F 门禁（rootfs/build/spike-f-ocr-gate.py，并行任务提供）的 CLI 为
      # --model-dir/--rpc-path/...，不支持 --chroot——故用 chroot 等价写法：
      # 门禁已随构建装入 /opt/alas/，chroot 进 work/rootfs 跑。
      # 注意：**必须用 venv 的解释器**——M1 起依赖装在 /opt/alas/.venv，
      # 系统 python3（3.14.4）没有 numpy/cv2/onnxruntime，用它跑必然 ImportError。
      # TODO: 若门禁脚本日后支持 --chroot，可简化为宿主机直调
      #   python3 rootfs/build/spike-f-ocr-gate.py --chroot work/rootfs
      # 注：rootfs 内无中文字体（--font 缺省），合成图用例按门禁语义记 SKIP，不影响 PASS 判定
      - name: Spike F OCR gate
        run: |
          # 构建脚本打包前已显式卸载全部 bind mount；chroot 跑门禁前重新挂上
          # （onnxruntime 的 CPU 拓扑探测读 /sys，缺 /proc /sys /dev 时行为不确定）
          for d in dev proc sys; do sudo mount --bind /$d work/rootfs/$d; done
          trap 'for d in sys proc dev; do sudo umount -lf work/rootfs/$d || true; done' EXIT
          sudo chroot work/rootfs /opt/alas/.venv/bin/python /opt/alas/spike-f-ocr-gate.py \
            --model-dir /opt/alas/models/ocr \
            --rpc-path /opt/alas/module/ocr/rpc.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            dist/rootfs.tar.xz
            dist/BUILD_MANIFEST
          retention-days: 14
